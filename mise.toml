[tools]
node = "24"
pnpm = "latest"
prek = "latest"
cocogitto = "latest"
gitleaks = "8"

[tasks.check]
description = "Validate trilingual docs, lint (incl. type check), secret-scan, format-check"
run = [
  "node tools/check-docs.ts",
  "pnpm exec oxlint tools",
  "gitleaks dir . --redact",
  "pnpm exec oxfmt --check .",
]

[tasks.fix]
description = "Fix punctuation and digests, then format markdown and tools/"
run = ["node tools/check-docs.ts --fix", "pnpm exec oxfmt .", "node tools/check-docs.ts --fix"]

[tasks.test]
description = "Run validator tests"
run = "node --test tools/check-docs.test.ts"
