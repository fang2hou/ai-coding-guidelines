[tools]
node = "24"
"npm:oxlint" = "latest"
"npm:oxfmt" = "latest"
prek = "latest"
cocogitto = "latest"

[tasks.check]
description = "Validate trilingual docs, lint and format-check"
run = ["node tools/check-docs.ts", "oxlint tools", "oxfmt --check ."]

[tasks.fix]
description = "Fix punctuation and digests, then format markdown and tools/"
run = ["node tools/check-docs.ts --fix", "oxfmt .", "node tools/check-docs.ts --fix"]

[tasks.test]
description = "Run validator tests"
run = "node --test tools/check-docs.test.ts"
