name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository (full history for cog)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install toolchain (mise)
        uses: jdx/mise-action@v4
      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Validate documents, lint and format (mise run check)
        run: mise run check
      - name: Run validator tests (mise run test)
        run: mise run test
      - name: Check commit history (cog check)
        run: cog check

  validate-pr-title:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install toolchain (mise)
        uses: jdx/mise-action@v4
      - name: Configure Git identity (required by cog)
        run: |
          git config --global user.name "pr-title-check"
          git config --global user.email "pr-title-check@users.noreply.github.com"
      - name: Verify PR title (cog verify)
        run: cog verify "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
