name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: mise run check
      - run: mise run test
      - run: cog check

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: cog verify "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
