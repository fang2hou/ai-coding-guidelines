name: check

on:
  - pull_request
  - push:
      branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: mise run check
      - run: mise run test
      - run: cog check
