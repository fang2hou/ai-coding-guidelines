name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install toolchain (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Validate documents, lint and format (mise run check)
        run: mise run check
      - name: Run validator tests (mise run test)
        run: mise run test

  validate-commit-history:
    name: Validate commit history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository (full history for cog)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install toolchain (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Check commit history (cog check)
        run: cog check
