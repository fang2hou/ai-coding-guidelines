name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install toolchain (mise)
        uses: jdx/mise-action@v4
      - name: Configure Git identity (required by cog)
        run: |
          git config --global user.name "pr-title-check"
          git config --global user.email "pr-title-check@users.noreply.github.com"
      - name: Verify PR title (cog verify)
        run: cog verify "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
